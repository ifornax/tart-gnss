# LEGACY hand-curated TART station catalogue for tart_gnss.
#
# Since the station-registry integration the DEFAULT catalogue is the generated
# stations_registry.yaml (keyed by canonical TART id, built by
# `update-tart-stations`), and aliases such as "mauritius" live in
# station_aliases.yaml. This file is kept so that `--station-file` with it,
# and Stage-1 results produced from it, continue to work unchanged.
#
# Coordinates are WGS84 geodetic latitude/longitude (degrees, east-positive)
# and height (metres) exactly as published by the TART project. They were NOT
# estimated or invented by this software.
#
# Authoritative source: the TART network-monitor registry
#   https://map.elec.ac.nz/api/v1/telescopes
# field `telescopes[].telescopeInfo.info.location`, which mirrors each
# telescope's own `/api/v1/info` endpoint (https://api.elec.ac.nz/tart/<id>/api/v1/info).
# Retrieved 2026-10-07T10:03Z.
#
# NOTE: these are the coordinates configured on each telescope by its
# operators; their geodetic accuracy (and the vertical datum of `alt`) is not
# documented by the source. Replace them with surveyed values when available.
#
# To add a station, add an entry below; no code change is required.
# `api_url` is the TART REST API base URL. It follows the pattern
# https://api.elec.ac.nz/tart/<tart_id> used by tart2ms. At 2026-10-07T10:05Z
# /api/v1/info answered HTTP 200 only for za-rhodes and ghana; the others were
# offline (502/timeout), so those API URLs are unverified. Stage 2 does not
# need the live API: it reads the archive.
#
# `archive_name` is the telescope's prefix in the TART visibility archive
# (public S3 bucket "tart", s3.us-west-2.amazonaws.com, layout
# <archive_name>/vis/<year>/<month>/<day>/vis_<timestamp>.hdf, as used by
# tart_tools.archive_handler). Every archive_name below was verified to exist
# by listing the bucket on 2026-10-07T12:00Z.

stations:

  mauritius:
    name: "TART Mauritius (Bel Air)"
    tart_id: "mu-udm"
    api_url: "https://api.elec.ac.nz/tart/mu-udm"
    archive_name: "mu-udm"
    latitude_deg: -20.2587508
    longitude_deg: 57.7591989
    altitude_m: 20.0
    source: "TART registry https://map.elec.ac.nz/api/v1/telescopes (node mu-udm), retrieved 2026-10-07T10:03Z"

  madagascar:
