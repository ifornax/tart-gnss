[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tart-gnss"
version = "0.1.0"
description = "Stage 1 of the TART GNSS localisation pipeline: common GNSS visibility windows for multiple TART stations"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Nadeem Oozeer", email = "nadeem.oozeer@ru.ac.za" }]
keywords = ["TART", "radio astronomy", "GNSS", "SGP4", "satellite", "visibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21",
    "skyfield>=1.45",
    "sgp4>=2.20",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5", "build"]

[project.scripts]
common-gnss = "tart_gnss.cli:main"

[project.urls]
Homepage = "https://github.com/ifornax/tart-gnss"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tart_gnss = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
