[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tart-gnss"
version = "0.5.0"
description = "TART GNSS satellite-localisation pipeline: common visibility windows, observation retrieval, per-station direction estimation, multi-station triangulation and TLE-independent trajectory tracking"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Nadeem Oozeer", email = "nadeem.oozeer@ru.ac.za" }]
keywords = ["TART", "radio astronomy", "GNSS", "SGP4", "satellite", "visibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21",
    "skyfield>=1.45",
    "sgp4>=2.20",
    "PyYAML>=5.4",
    "requests>=2.28",
]

[project.optional-dependencies]
# Stage 2: archive access and native HDF5 inspection
stage2 = ["h5py>=3.1", "minio>=7"]
# Stage 2: Measurement-Set conversion (tart2ms) and validation (python-casacore)
ms = ["tart2ms>=0.9.4", "python-casacore>=3.5"]
test = ["pytest>=7", "h5py>=3.1"]
plot = ["matplotlib>=3.5"]
# Stage 3: direction estimation from Measurement Sets
stage3 = ["scipy>=1.7", "pandas>=1.3", "pyarrow>=6", "matplotlib>=3.5", "python-casacore>=3.5"]
# Stages 4-5: triangulation and trajectory tracking from saved tables
stage5 = ["scipy>=1.7", "pandas>=1.3", "pyarrow>=6", "matplotlib>=3.5"]
all = ["h5py>=3.1", "minio>=7", "tart2ms>=0.9.4", "python-casacore>=3.5", "matplotlib>=3.5",
       "scipy>=1.7", "pandas>=1.3", "pyarrow>=6"]
dev = ["pytest>=7", "h5py>=3.1", "minio>=7", "matplotlib>=3.5", "scipy>=1.7", "pandas>=1.3", "pyarrow>=6",
       "build"]

[project.scripts]
tart-common-gnss = "tart_gnss.cli:main"
tart-retrieve = "tart_gnss.stage2.cli:main"
tart-stations-update = "tart_gnss.registry_cli:main_update"
tart-stations-list = "tart_gnss.registry_cli:main_list"
tart-localise = "tart_gnss.stage3.cli:main"
tart-triangulate = "tart_gnss.stage4.cli:main"
tart-track = "tart_gnss.stage5.cli:main"

[project.urls]
Homepage = "https://github.com/ifornax/tart-gnss"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tart_gnss = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
