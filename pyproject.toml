[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tart-gnss"
version = "0.2.0"
description = "TART GNSS satellite-localisation pipeline: Stage 1 common GNSS visibility windows and Stage 2 TART observation retrieval"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Nadeem Oozeer", email = "nadeem.oozeer@ru.ac.za" }]
keywords = ["TART", "radio astronomy", "GNSS", "SGP4", "satellite", "visibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21",
    "skyfield>=1.45",
    "sgp4>=2.20",
    "PyYAML>=5.4",
    "requests>=2.28",
]

[project.optional-dependencies]
# Stage 2: archive access and native HDF5 inspection
stage2 = ["h5py>=3.1", "minio>=7"]
# Stage 2: Measurement-Set conversion (tart2ms) and validation (python-casacore)
ms = ["tart2ms>=0.9.4", "python-casacore>=3.5"]
test = ["pytest>=7", "h5py>=3.1"]
plot = ["matplotlib>=3.5"]
all = ["h5py>=3.1", "minio>=7", "tart2ms>=0.9.4", "python-casacore>=3.5", "matplotlib>=3.5"]
dev = ["pytest>=7", "h5py>=3.1", "minio>=7", "matplotlib>=3.5", "build"]

[project.scripts]
common-gnss = "tart_gnss.cli:main"
retrieve-tart = "tart_gnss.stage2.cli:main"
update-tart-stations = "tart_gnss.registry_cli:main_update"
list-tart-stations = "tart_gnss.registry_cli:main_list"

[project.urls]
Homepage = "https://github.com/ifornax/tart-gnss"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tart_gnss = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
